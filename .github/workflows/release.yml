name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Florin ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download the app for your platform.
            
            **Installation:**
            - **Windows**: Download and run the `.msi` installer
            - **macOS**: Download the `.dmg`, open it, and drag Florin to Applications
            - **Linux (Debian/Ubuntu)**: Download the `.deb` file and run `sudo dpkg -i Florin_*_amd64.deb`
            - **Linux (Fedora/RHEL)**: Download the `.rpm` file and run `sudo rpm -i Florin-*.x86_64.rpm`
            - **Linux (Arch)**: Download the `.pkg.tar.zst` file and run `sudo pacman -U florin-*.pkg.tar.zst`
            
            For more information, see the [README](https://github.com/DevprojectEkla/florin/blob/main/README.md).
          releaseDraft: true
          prerelease: false
          # latest.json + .sig files, read by the in-app updater
          includeUpdaterJson: true
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

  # Arch Linux package (.pkg.tar.zst), built from packaging/arch/PKGBUILD.
  # Runs after the draft release exists so the package can be attached to it.
  arch:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs npm pkgconf webkit2gtk-4.1 gtk3 glib2 openssl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # pkgver may not contain hyphens
          echo "version=${VERSION//-/_}" >> "$GITHUB_OUTPUT"

      # makepkg refuses to run as root, so build as an unprivileged user
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pkgdest && chown builder:builder /tmp/pkgdest
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && FLORIN_VERSION='${{ steps.version.outputs.version }}' PKGDEST=/tmp/pkgdest makepkg --noconfirm --cleanbuild"
          cp /tmp/pkgdest/*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: florin-arch
          path: florin-*.pkg.tar.zst

      - name: Attach package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: florin-*.pkg.tar.zst
